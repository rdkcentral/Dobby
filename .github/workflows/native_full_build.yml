name: Build Component in Native Environment

on:
  push:
    branches: [ main, 'sprint/**', 'release/**', master ]
  pull_request:
    branches: [ main, 'sprint/**', 'release/**', master ]
  workflow_call:
    inputs:
      pull_request_number:
        description: Pull request number whose merge ref should be built
        required: true
        type: string

jobs:
  build-dobby-on-pr:
    name: Build dobby component in github rdkcentral
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest
   
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_call'
        uses: actions/checkout@v4

      - name: Checkout pull request merge ref
        if: github.event_name == 'workflow_call'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pull_request_number }}/merge

      - name: native build
        run: |
          sh -x build_dependencies.sh
          sh -x cov_build.sh
